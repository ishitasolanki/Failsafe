<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Failsafe — recovery audit</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36; --text: #e6e9ef;
    --dim: #8b94a7; --good: #3fb950; --bad: #f85149; --warn: #d29922;
    --accent: #4c8dff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header { padding: 22px 26px 14px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 19px; letter-spacing: -.2px; }
  h1 span { color: var(--dim); font-weight: 400; }
  .sub { color: var(--dim); margin-top: 4px; font-size: 13px; }
  .cards { display: flex; gap: 12px; flex-wrap: wrap; padding: 18px 26px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px 16px; min-width: 150px;
  }
  .card .k { color: var(--dim); font-size: 11px; text-transform: uppercase;
             letter-spacing: .6px; }
  .card .v { font-size: 21px; font-weight: 600; margin-top: 3px;
             font-variant-numeric: tabular-nums; }
  .card .base { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .zero { color: var(--good); }
  main { display: grid; grid-template-columns: minmax(340px, 460px) 1fr;
         gap: 0; align-items: start; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .list { border-right: 1px solid var(--line); max-height: 74vh; overflow: auto; }
  .row {
    padding: 10px 26px; border-bottom: 1px solid var(--line); cursor: pointer;
    display: flex; gap: 10px; align-items: baseline;
  }
  .row:hover { background: #1b1f27; }
  .row.sel { background: #1d2430; box-shadow: inset 3px 0 0 var(--accent); }
  .row .id { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
             font-size: 12px; color: var(--dim); }
  .row .arch { flex: 1; font-size: 13px; }
  .row .amt { font-variant-numeric: tabular-nums; font-size: 12px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .dot.ok { background: var(--good); } .dot.no { background: var(--bad); }
  .flag { color: var(--warn); font-size: 11px; }
  .detail { padding: 18px 26px; max-height: 74vh; overflow: auto; }
  .empty { color: var(--dim); padding: 40px 26px; }
  .step { border-left: 2px solid var(--line); padding: 0 0 16px 16px;
          position: relative; }
  .step::before {
    content: ""; position: absolute; left: -5px; top: 5px; width: 8px;
    height: 8px; border-radius: 50%; background: var(--accent);
  }
  .step.stop::before { background: var(--bad); }
  .step.act::before { background: var(--warn); }
  .stage { font-size: 11px; text-transform: uppercase; letter-spacing: .7px;
           color: var(--dim); }
  .step .main { margin-top: 2px; }
  code { background: #0b0d11; border: 1px solid var(--line); border-radius: 4px;
         padding: 1px 5px; font-size: 12px;
         font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .ts { color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; }
  .why { color: var(--dim); font-size: 12px; margin-top: 3px; font-style: italic; }
  .banner { margin: 0 26px 14px; padding: 10px 14px; border-radius: 6px;
            background: #2a1f14; border: 1px solid #4a3418; color: #e8c98a;
            font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>Failsafe <span>— every money action, explained</span></h1>
  <div class="sub" id="sub">loading…</div>
</header>

<div id="err"></div>
<div class="cards" id="cards"></div>

<main>
  <div class="list" id="list"></div>
  <div class="detail" id="detail"><div class="empty">Select a payment to see its full decision chain.</div></div>
</main>

<script>
const rs = p => "₹" + (p / 100).toLocaleString("en-IN", {maximumFractionDigits: 0});
let selected = null;

async function get(url) {
  const response = await fetch(url);
  if (!response.ok) throw new Error((await response.json()).detail || response.statusText);
  return response.json();
}

function card(label, value, baseline, good) {
  return `<div class="card"><div class="k">${label}</div>
    <div class="v ${good ? "zero" : ""}">${value}</div>
    ${baseline ? `<div class="base">${baseline}</div>` : ""}</div>`;
}

async function loadSummary() {
  const s = await get("/api/summary");
  const f = s.failsafe, n = s.naive;
  document.getElementById("cards").innerHTML = [
    card("Recovered", `${f.recovered} / ${f.payments}`, `baseline ${n.recovered}`),
    card("Money recovered", rs(f.money_recovered), `baseline ${rs(n.money_recovered)}`),
    card("Actions spent", f.actions, `baseline ${n.actions}`),
    card("Compliance violations", f.compliance_violations,
         `baseline ${n.compliance_violations}`, f.compliance_violations === 0),
  ].join("");
  document.getElementById("sub").textContent =
    `held-out split · ${f.payments} failed payments · both strategies over the identical pre-rolled world`;
}

async function loadList() {
  const items = await get("/api/payments");
  document.getElementById("list").innerHTML = items.map(p => `
    <div class="row" data-id="${p.payment_id}">
      <div class="dot ${p.recovered ? "ok" : "no"}"></div>
      <div class="id">${p.payment_id.replace("pay_", "")}</div>
      <div class="arch">${p.archetype || "—"}
        ${p.misdiagnosed ? `<span class="flag">· misdiagnosed (${p.truth})</span>` : ""}
      </div>
      <div class="amt">${rs(p.amount)}</div>
    </div>`).join("");
  document.querySelectorAll(".row").forEach(row =>
    row.onclick = () => showChain(row.dataset.id, row));
}

async function showChain(id, row) {
  if (selected) selected.classList.remove("sel");
  selected = row; row.classList.add("sel");

  const data = await get(`/api/payment/${id}`);
  const steps = data.chain.map(e => {
    const cls = e.stage === "stop" ? "stop" : (e.stage === "act" ? "act" : "");
    let main = "";
    if (e.stage === "diagnose") {
      main = `diagnosed <code>${e.archetype}</code>
        ${e.confidence != null ? `at ${(e.confidence * 100).toFixed(0)}% confidence` : ""}
        <span class="ts">via ${e.diagnosis_method}</span>`;
    } else if (e.stage === "decide") {
      main = `rule <code>${e.rule_fired}</code> → <code>${e.action}</code>`;
    } else if (e.stage === "act") {
      main = `<code>${e.action}</code> → ${e.action_result}
        ${e.provider_ref ? `<span class="ts">${e.provider_ref}</span>` : ""}`;
    } else if (e.stage === "verify") {
      main = `mandate checked → <code>${e.action_result}</code>`;
    } else if (e.stage === "escalate") {
      main = `human review → <code>${e.action_result}</code>`;
    } else if (e.stage === "observe") {
      main = `provider reports <code>${e.action_result}</code>`;
    } else if (e.stage === "stop") {
      main = `stopped: <code>${e.stop_reason}</code>`;
    }
    return `<div class="step ${cls}">
      <div class="stage">${e.stage}${e.attempt ? ` · attempt ${e.attempt}` : ""}</div>
      <div class="main">${main}</div>
      ${e.llm_reason ? `<div class="why">“${e.llm_reason}”</div>` : ""}
      <div class="ts">${e.ts.replace("T", " ").slice(0, 16)}</div>
    </div>`;
  }).join("");

  document.getElementById("detail").innerHTML =
    `<div style="margin-bottom:14px">
       <code>${id}</code>
       <span class="ts"> · true archetype ${data.truth || "unknown"}</span>
     </div>${steps}`;
}

(async () => {
  try {
    await loadSummary();
    await loadList();
  } catch (error) {
    document.getElementById("err").innerHTML =
      `<div class="banner">${error.message}</div>`;
    document.getElementById("sub").textContent = "no run loaded";
  }
})();
</script>
</body>
</html>
